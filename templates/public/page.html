{% extends "base.html" %}
{% block title %}{{ page.title }}{% endblock %}
{% block content %}
  <div class="card">
    <h1 style="margin-top:0;">{{ page.title }}</h1>
    <div class="cms-content">
      {{ page.content|safe }}
    </div>
    {% if page.published_at %}
      <p class="muted" style="font-size:.8rem;">Last published {{ page.published_at|date:"Y-m-d" }}</p>
    {% endif %}
  </div>
{% endblock %}
