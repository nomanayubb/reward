{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
  <div class="card" style="max-width:460px;margin:2rem auto;">
    <h1 style="margin-top:0;">Create your account</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.non_field_errors }}
      {% for field in form %}
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {{ field.errors }}
      {% endfor %}
      <p><button class="primary" type="submit">Register</button></p>
    </form>
    <p class="muted">Already registered? <a href="{% url 'login-page' %}">Log in</a></p>
  </div>
{% endblock %}
