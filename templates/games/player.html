{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ game.title }} — Play</title>
  <style>
    html, body { margin: 0; height: 100%; background: #10131a; }
    #game-frame { display: block; width: 100%; height: 100vh; border: 0; }
  </style>
</head>
<body>
  <iframe
    id="game-frame"
    src="{{ game_url }}?origin={{ platform_origin|urlencode }}"
    title="{{ game.title }}"
  ></iframe>

  {{ user_data|json_script:"user-data" }}
  {{ config_data|json_script:"config-data" }}

  <script src="{% static 'game-sdk/game-host.js' %}"></script>
  <script>
    (function () {
      var frame = document.getElementById("game-frame");
      initGameHost({
        iframe: frame,
        gameSlug: "{{ game.slug|escapejs }}",
        gameOrigin: new URL(frame.src, window.location.href).origin,
        user: JSON.parse(document.getElementById("user-data").textContent),
        config: JSON.parse(document.getElementById("config-data").textContent)
      });
    })();
  </script>
</body>
</html>
