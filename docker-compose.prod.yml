# Production stack for your own server (VPS) — no PaaS dependency.
#
#   1. copy .env.example .env  and set: DOMAIN, SECRET_KEY, POSTGRES_PASSWORD,
#      ALLOWED_HOSTS/CSRF are derived from DOMAIN below
#   2. docker compose -f docker-compose.prod.yml up -d --build
#   3. Caddy obtains HTTPS certificates automatically for $DOMAIN
#
# Same code as everywhere else: Django + Gunicorn + PostgreSQL + Redis +
# Celery. Nothing here is Render-specific.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reward}
      POSTGRES_USER: ${POSTGRES_USER:-reward}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reward}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      args:
        REQUIREMENTS_FILE: production.txt
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://${POSTGRES_USER:-reward}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-reward}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      ALLOWED_HOSTS: ${DOMAIN},www.${DOMAIN}
      CSRF_TRUSTED_ORIGINS: https://${DOMAIN},https://www.${DOMAIN}
      SITE_URL: https://${DOMAIN}
      SECURE_SSL_REDIRECT: "True"
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      args:
        REQUIREMENTS_FILE: production.txt
    restart: unless-stopped
    command: celery -A config worker -l info
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://${POSTGRES_USER:-reward}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-reward}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      - db
      - redis

  beat:
    build:
      context: .
      args:
        REQUIREMENTS_FILE: production.txt
    restart: unless-stopped
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://${POSTGRES_USER:-reward}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-reward}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      - db
      - redis

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
  static_data:
  media_data:
  caddy_data:
  caddy_config:
