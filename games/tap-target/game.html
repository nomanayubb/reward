<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Tap Target</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header id="hud">
    <span>Score <b id="score">0</b></span>
    <span>Time <b id="time">30</b>s</span>
    <span id="connection" class="muted">connecting…</span>
  </header>

  <main id="board" aria-label="Tap the targets as fast as you can"></main>

  <div id="overlay">
    <h1>Tap Target</h1>
    <p>Tap the circles before they vanish. You have 30 seconds.</p>
    <button id="start-button" type="button">Start</button>
  </div>

  <script src="/static/game-sdk/game-sdk.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
